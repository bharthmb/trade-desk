name: alerts
on:
  schedule:
    - cron: "3 * * * *"      # every hour at :03 UTC (= :33 IST). 4h candles close at 00/04/08/12/16/20 UTC; the daily candle at 00:00 UTC = 5:30 am IST.
  workflow_dispatch:         # lets you press "Run workflow" to test
permissions:
  contents: write
concurrency: alerts
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: check signals and send alerts
        run: python alerts/signals.py
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE:   ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY:  ${{ secrets.WHATSAPP_APIKEY }}
          TWELVEDATA_KEY:   ${{ secrets.TWELVEDATA_KEY }}
          ONLY_COINS:       ${{ vars.ONLY_COINS }}
      - name: remember what was sent
        run: |
          git config user.name "trade-desk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add alerts/state.json
          git diff --cached --quiet || (git commit -m "bot state" && git push)
