<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trade Desk</title>
<meta name="description" content="Daily trading desk: today's trades, exact rules, live charts, sizing and an intelligent calculator.">
<meta name="theme-color" content="#101820">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trade Desk">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Prop Desk — "flight strip" desk. One family (Manrope), tabular numerals, a status rail instead of card chrome.
   The hero is the day's timeline in IST: the only decorated element. Everything else is a list. */
:root{
  color-scheme:light;
  --bg:#eef1f4; --sf:#ffffff; --sf2:#f5f7f9; --ln:#dfe4ea; --ink:#101820; --ink2:#5b6774; --ink3:#8a96a3;
  --go:#0f7a6a; --go-bg:#dff3ee; --warn:#b8690b; --warn-bg:#fbefd9; --stop:#c0392b; --stop-bg:#fae3e0; --gold:#a8791a;
  --rail:#101820; --focus:#0f7a6a;
  --f:"Manrope",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark; --bg:#0b0f13; --sf:#141a21; --sf2:#1a222b; --ln:#263039; --ink:#e9eef3; --ink2:#9aa7b4; --ink3:#6f7c8a;
  --go:#3fc9ad; --go-bg:#113129; --warn:#f0a63b; --warn-bg:#352711; --stop:#ff7b6e; --stop-bg:#3d1c19; --gold:#e2b45a; --rail:#e9eef3;
}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#0b0f13; --sf:#141a21; --sf2:#1a222b; --ln:#263039; --ink:#e9eef3; --ink2:#9aa7b4; --ink3:#6f7c8a;
  --go:#3fc9ad; --go-bg:#113129; --warn:#f0a63b; --warn-bg:#352711; --stop:#ff7b6e; --stop-bg:#3d1c19; --gold:#e2b45a; --rail:#e9eef3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.45 var(--f);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 80px}
h1{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0}
h2{font-size:24px;font-weight:800;letter-spacing:-.025em;line-height:1.1;margin:0;text-wrap:balance}
h3{font-size:13px;font-weight:700;color:var(--ink2);margin:0 0 8px}
p{margin:0} b,strong{font-weight:700}
.mono{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--go)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input,select{font:600 16px var(--f);padding:11px 12px;border:1.5px solid var(--ln);border-radius:12px;background:var(--sf);color:var(--ink);min-width:0;width:100%}
input:disabled{opacity:.6}
/* app bar */
.bar{position:sticky;top:0;z-index:9;background:var(--bg);padding-top:max(10px,env(safe-area-inset-top))}
.barT{display:flex;gap:10px;align-items:center;justify-content:space-between}
.acct{display:inline-flex;gap:8px;align-items:center;background:var(--sf);border:1.5px solid var(--ln);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;flex:1;min-width:0;justify-content:flex-start}
.acct span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .acct i{width:8px;height:8px;border-radius:50%;background:var(--go);flex:none}
.tools{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--sf);border:1.5px solid var(--ln);border-radius:999px;padding:2px}
.seg button{border:0;background:transparent;padding:6px 10px;font-weight:700;font-size:13px;border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.iconb{border:1.5px solid var(--ln);background:var(--sf);border-radius:999px;height:34px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:10px 0 8px}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:transparent;color:var(--ink2);padding:8px 11px;font-weight:700;font-size:14.5px;white-space:nowrap;border-radius:999px}
.nav button[aria-current="page"]{color:var(--bg);background:var(--ink)}
/* surfaces */
.view{display:grid;gap:12px;margin-top:8px}
.card{background:var(--sf);border-radius:18px;padding:16px 18px}
.card.tint{background:var(--sf)}
.head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink2);font-size:14px} .sm{font-size:13px}
.tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;background:var(--sf2);color:var(--ink2)}
.tag.gold{background:var(--warn-bg);color:var(--gold)} .tag.green{background:var(--go-bg);color:var(--go)} .tag.amber{background:var(--warn-bg);color:var(--warn)} .tag.red{background:var(--stop-bg);color:var(--stop)} .tag.blue{background:var(--sf2);color:var(--ink)}
.btn{border:1.5px solid var(--ln);background:var(--sf);border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;display:inline-flex;gap:7px;align-items:center;justify-content:center;text-decoration:none;color:inherit}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--stop);border-color:var(--stop)}
.btn.s{padding:6px 12px;font-size:13px} .btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.inl{display:flex;gap:6px;align-items:center;flex-wrap:nowrap} .inl input{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.grid label,.lbl{display:grid;gap:5px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.back{background:none;border:0;color:var(--ink2);font-weight:700;font-size:14px;padding:0}
/* hero: the day line */
.hero{background:var(--sf);border-radius:18px;padding:16px 18px 14px}
.hero .date{font-size:13.5px;font-weight:700;color:var(--ink2)}
.hero .title{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-top:2px}
.hero .title small{font-size:15px;font-weight:700;color:var(--ink2);letter-spacing:0;margin-left:4px}
.dayline{width:100%;height:auto;display:block;margin-top:12px}
.next{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--go-bg)}
.next b{font-size:16px;font-weight:800}.next .in{font-size:20px;font-weight:800;color:var(--go);white-space:nowrap;letter-spacing:-.02em}
.kpis{display:flex;gap:18px;margin-top:12px;flex-wrap:wrap}
.kpi{min-width:0} .kpi>b{display:block;font-size:12px;font-weight:700;color:var(--ink2)} .kpi span{font-size:17px;font-weight:800;letter-spacing:-.01em} .kpi small{color:var(--ink3);font-size:12px;margin-left:4px}
/* checklist */
.sched{display:grid;gap:0}
.it{display:grid;grid-template-columns:66px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--ln)}
.it:first-child{border-top:0}
.it .t{font-size:13px;font-weight:800;color:var(--ink)} .it .t.off{color:var(--ink3)}
.it .x{font-size:15px;font-weight:600} .it .x small{display:block;color:var(--ink2);font-size:12.5px;font-weight:500}
.it .go{color:var(--ink3);font-size:18px;text-decoration:none}
/* trade rows (status rail) */
.plan{display:grid;gap:8px}
.srow{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}
.sw{position:relative;width:38px;height:22px;display:block;flex:none}.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}.sw i{position:absolute;inset:0;border-radius:999px;background:var(--ln);transition:background .15s}.sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--sf);transition:transform .15s}.sw input:checked+i{background:var(--go)}.sw input:checked+i::after{transform:translateX(16px)}.sw input:focus-visible+i{outline:2px solid var(--focus)}
.pc{display:grid;grid-template-columns:5px 1fr auto;gap:0 12px;background:var(--sf2);border-radius:14px;overflow:hidden;cursor:pointer;align-items:stretch}
.pc .rail{background:var(--go)} .pc .rail.amber{background:var(--warn)} .pc .rail.red{background:var(--stop)} .pc .rail.grey{background:var(--ln)}
.pc .ti{padding:12px 0 12px 2px;min-width:0} .pc .ti b{font-size:16.5px;font-weight:800;letter-spacing:-.01em} .pc .ti div{color:var(--ink2);font-size:13px;margin-top:2px}
.pc .sig{font-size:13px;margin-top:5px;font-weight:600}
.pc .nums{display:grid;grid-template-columns:auto auto;gap:2px 14px;padding:12px 14px 12px 0;align-items:center;text-align:right}
.pc .nums b{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.1} .pc .nums small{display:block;color:var(--ink2);font-size:11.5px;font-weight:600}
.pc.off{opacity:.55}
/* rule tiles */
.rules{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:420px){.rules{grid-template-columns:1fr}}
.rule{background:var(--sf2);border-radius:14px;padding:12px 14px;min-width:0;border-left:4px solid var(--ln)}
.rule>b{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:3px}
.rule .v{font-size:17px;font-weight:800;line-height:1.25;letter-spacing:-.01em} .rule .v em{font-style:normal;color:var(--go)}
.rule small{display:block;color:var(--ink2);font-size:12.5px;margin-top:3px;line-height:1.35}
.rule.buy{border-color:var(--go)} .rule.sell{border-color:var(--stop)} .rule.stop{border-color:var(--warn)} .rule.when{border-color:var(--ink)}
/* numbers */
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:460px){.nums{grid-template-columns:1fr 1fr}}
.cell{background:var(--sf2);border-radius:14px;padding:12px 13px;min-width:0}
.cell>b{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:2px}
.cell .v{font-size:24px;font-weight:800;letter-spacing:-.025em;line-height:1.1;word-break:break-word}
.cell small{display:block;color:var(--ink2);font-size:12px;margin-top:3px;line-height:1.35}
.cell.ok{background:var(--go-bg)} .cell.over{background:var(--warn-bg)} .cell.bad{background:var(--stop-bg)} .cell.hi{box-shadow:inset 0 0 0 2px var(--ink)}
.verdict{border-radius:14px;padding:12px 14px;font-size:14.5px;display:flex;gap:10px;align-items:flex-start;background:var(--sf2)}
.verdict .em{font-size:16px;font-weight:800}
.verdict.go{background:var(--go-bg)} .verdict.cut{background:var(--warn-bg)} .verdict.stop{background:var(--stop-bg)}
/* chart */
.chartbox{position:relative;border-radius:14px;overflow:hidden;background:var(--sf2);height:min(62vh,460px)}
.chartbox .tv{width:100%;height:100%}
.chartbox .fb{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px}
.schem{width:100%;height:150px;display:block;border-radius:12px;background:var(--sf2)}
.setup{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.setup span{background:var(--sf2);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.setup span i{font-style:normal;color:var(--ink2);font-weight:600;margin-right:6px}
/* holdings */
.meter{height:8px;background:var(--sf2);border-radius:6px;overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--go);width:0;transition:width .2s} .meter i.hot{background:var(--warn)} .meter i.over{background:var(--stop)}
.pos{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--ln);font-size:14.5px}
.pos small{display:block;color:var(--ink2);font-size:12.5px}
.pos .r{font-weight:800;font-size:15px;text-align:right} .pos .r small{text-align:right}
.x{background:none;border:0;color:var(--ink3);font-size:18px;padding:0 4px}
details{border-top:1px solid var(--ln);padding-top:12px;margin-top:12px}
details>summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--ink2);list-style:none;display:flex;gap:6px;align-items:center}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"›";font-size:18px;display:inline-block;transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
.body{margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--ln);vertical-align:top}
th{font-size:12px;font-weight:700;color:var(--ink2)}
td.n,th.n{text-align:right}
.inst{display:grid;gap:0}
.ir{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}
.ir:first-child{border-top:0}
.ir .nm{font-weight:700;font-size:15px} .ir .nm small{display:block;color:var(--ink2);font-size:12.5px;font-weight:500}
.ir.yes{cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:460px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:var(--sf2);border-radius:12px;padding:10px 12px} .stat .v{font-size:19px;font-weight:800;letter-spacing:-.02em} .stat small{display:block;color:var(--ink2);font-size:12px;margin-top:2px}
.empty{text-align:center;color:var(--ink2);padding:18px}
.foot{color:var(--ink3);font-size:12.5px;margin-top:22px;line-height:1.5}
.lines{display:grid;gap:7px} .line{display:flex;gap:9px;font-size:14px} .line .m{color:var(--go)} .line.no .m{color:var(--stop)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.accsw{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:2px}
.accsw::-webkit-scrollbar{display:none}
.accsw button{flex:none;border:1.5px solid var(--ln);background:var(--sf);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;white-space:nowrap}
.accsw button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.subh{font-size:12.5px;font-weight:700;color:var(--ink2);margin:14px 0 8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.cal .dow{text-align:center;font-size:10.5px;font-weight:700;color:var(--ink3);padding:2px 0}
.cal .c{aspect-ratio:1;border-radius:10px;background:var(--sf2);padding:5px 6px;font-size:12px;font-weight:700;display:flex;flex-direction:column;justify-content:space-between;border:2px solid transparent;overflow:hidden}
.cal .c.empty{background:transparent}
.cal .c.has{cursor:pointer}
.cal .c.sel{border-color:var(--ink)}
.cal .c.today .d{color:var(--go)}
.cal .c .pl{font-size:10px;font-weight:800;align-self:flex-end}
.pl.up{color:var(--go)} .pl.down{color:var(--stop)}
.jsum{display:flex;gap:22px;flex-wrap:wrap;margin-top:12px}
.jsum b{display:block;font-size:12px;color:var(--ink2);font-weight:700}.jsum span{font-size:20px;font-weight:800;letter-spacing:-.02em}
.arow{display:flex;gap:18px;margin-top:12px;padding-top:12px;border-top:1px solid var(--ln)}
.arow>div{min-width:0}.arow b{font-size:18px;font-weight:800}.arow small{display:block;color:var(--ink2);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="barT">
      <h1>Trade&nbsp;Desk</h1>
      <button class="iconb" id="themeBtn" type="button" aria-label="Switch theme">◐</button>
    </div>
    <div class="barT" style="margin-top:8px">
      <button class="acct" id="acctPill" type="button"><i></i><span id="acctName">Add account</span></button>
      <div class="seg" role="group" aria-label="Risk per trade" title="Max loss per trade"><button data-risk="0.5" type="button">0.5%</button><button data-risk="1" type="button">1%</button><button data-risk="2" type="button">2%</button></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </header>
  <main class="view" id="view"></main>
  <p class="foot" id="foot">All times are India Standard Time. The stop stays at the strategy level; your risk % only sizes the quantity. Everything is saved on your device.</p>
</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const fmt=(x,d=0)=>(isFinite(x)?x:0).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const money=x=>'$'+fmt(x,0);
const pcts=(x,d=1)=>fmt(x*100,d)+'%';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pd=p=>p<2?4:p<100?3:p<10000?2:1; // decimals for a price
const DEF={route:'today',detail:null,risk:'1',accounts:[],activeAcct:null,pos:[],prices:{},cs:{},theme:'system',tdKey:'',sig:{},off:{},calcSize:0,journal:[],cal:0,selDay:null,autolog:[]};
let S={...DEF};
try{const z=JSON.parse(localStorage.getItem('propdesk4')||'null')||JSON.parse(localStorage.getItem('propdesk3')||'{}');S={...DEF,...z,pos:Array.isArray(z.pos)?z.pos:[],journal:Array.isArray(z.journal)?z.journal:[],autolog:Array.isArray(z.autolog)?z.autolog:[]};S.pos.forEach(p=>{if(!p.acct)p.acct=S.activeAcct||'none';if(!p.opened)p.opened=Date.now()})}catch(e){}
const save=()=>{try{localStorage.setItem('propdesk4',JSON.stringify(S))}catch(e){}};
const isDark=()=>document.documentElement.dataset.theme==='dark';

/* ---------- firms ---------- */
const FIRMS={
 'FundedNext':{has:['XAUUSD','XAGUSD','XPTUSD','BTCUSD','ETHUSD','XLMUSD','DOGEUSD','ADAUSD','XRPUSD','LTCUSD','LNKUSD','XMRUSD','NAS100','US500','US30','GER30','UK100','JP225','HK50','AUS200','FRA40','EU50','VIX','OIL','FX','STOCKS'],lev:{fx:100,metals:50,indices:50,crypto:2,energy:50},
   programs:{'Stellar 2-Step':{ph:[['Phase 1',8],['Phase 2',5],['Funded',0]],daily:5,max:10},'Stellar 1-Step':{ph:[['Phase 1',10],['Funded',0]],daily:3,max:6},'Stellar Lite':{ph:[['Phase 1',8],['Phase 2',4],['Funded',0]],daily:4,max:8}}},
 'FundingPips':{has:['XAUUSD','XAGUSD','BTCUSD','ETHUSD','NAS100','US500','US30','GER30','UK100','JP225','EU50','OIL','FX'],lev:{fx:100,metals:50,indices:50,crypto:2,energy:50},
   programs:{'2-Step':{ph:[['Phase 1',8],['Phase 2',5],['Funded',0]],daily:5,max:10},'1-Step':{ph:[['Phase 1',10],['Funded',0]],daily:4,max:6}}},
 'Other':{has:null,lev:{fx:100,metals:50,indices:50,crypto:2,energy:50},programs:{'Custom':{ph:[['Phase 1',8],['Phase 2',5],['Funded',0]],daily:5,max:10}}}
};
const SIZES=[5000,10000,25000,50000,100000,200000];
const TICK={FundedNext:{NAS100:'NDX100',US500:'SPX500',US30:'US30',GER30:'GER30',LNKUSD:'LNKUSD'},FundingPips:{NAS100:'NDX100',US500:'SPX500',US30:'DJI30',GER30:'GER40',UK100:'FTSE100',JP225:'JP225',EU50:'STX50'}};
function firmTicker(id){const a=acct();return a&&TICK[a.firm]&&TICK[a.firm][id]?TICK[a.firm][id]:id}
function firmHas(id){const a=acct();if(!a)return true;const f=FIRMS[a.firm];return f.has?f.has.includes(id):true}

/* ---------- symbols ---------- */
const SYMS=[
 {id:'XAUUSD',name:'Gold',group:'Metals',cls:'metals',price:4132,cs:100,step:0.01,unit:'oz',strats:['gold','fomc'],tv:'OANDA:XAUUSD',td:'XAU/USD',bn:'PAXGUSDT',bnNote:'≈ gold (PAXG)'},
 {id:'BTCUSD',name:'Bitcoin',group:'Crypto',cls:'crypto',price:85866,cs:1,step:0.01,unit:'BTC',strats:['btcTrend','btcMom'],tv:'BINANCE:BTCUSDT',bn:'BTCUSDT'},
 {id:'ETHUSD',name:'Ethereum',group:'Crypto',cls:'crypto',price:2675,cs:1,step:0.01,unit:'ETH',strats:['ethMom'],tv:'BINANCE:ETHUSDT',bn:'ETHUSDT'},
 {id:'XLMUSD',name:'Stellar',group:'Crypto',cls:'crypto',price:0.216,cs:1,step:0.01,unit:'XLM',strats:['altMom'],tv:'BINANCE:XLMUSDT',bn:'XLMUSDT'},
 {id:'DOGEUSD',name:'Dogecoin',group:'Crypto',cls:'crypto',price:0.093,cs:1,step:0.01,unit:'DOGE',strats:['altMom'],tv:'BINANCE:DOGEUSDT',bn:'DOGEUSDT'},

const FOMC=['2026-01-28','2026-03-18','2026-04-29','2026-06-17','2026-07-29','2026-09-16','2026-10-28','2026-12-09','2027-01-27','2027-03-17','2027-04-28','2027-06-09','2027-07-28','2027-09-15','2027-10-27','2027-12-08'].map(d=>({d}));
function nthSun(y,m,n){const d=new Date(Date.UTC(y,m,1));return 1+((7-d.getUTCDay())%7)+7*(n-1)}
function usDST(dt){const y=dt.getUTCFullYear(),s=Date.UTC(y,2,nthSun(y,2,2)),e=Date.UTC(y,10,nthSun(y,10,1)),t=Date.UTC(y,dt.getUTCMonth(),dt.getUTCDate());return t>=s&&t<e}
const istNow=()=>new Date(Date.now()+330*60000);
function daysUntil(s){const n=istNow(),a=Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate());const[y,m,d]=s.split('-').map(Number);return Math.round((Date.UTC(y,m-1,d)-a)/86400000)}
function nextFomc(){return FOMC.find(f=>daysUntil(f.d)>=0)||null}
function fomcT(s){const[y,m,d]=s.split('-').map(Number),x=usDST(new Date(Date.UTC(y,m-1,d)));return {entry:x?'1:30 am':'2:30 am',exit:x?'11:30 pm':'12:30 am'}}
function goldWin(dt){return usDST(dt)?'3:30 – 5:30 am':'4:30 – 6:30 am'}
function goldSeason(dt){const m=dt.getUTCMonth()+1;return m>=10||m<=2}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DAY=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function todayStr(){const d=istNow();return DAY[d.getUTCDay()]+' '+d.getUTCDate()+' '+MON[d.getUTCMonth()]}
function daysToGold(){const d=istNow(),y=d.getUTCFullYear();return Math.max(0,Math.round((Date.UTC(y,9,1)-Date.UTC(y,d.getUTCMonth(),d.getUTCDate()))/86400000))}

/* ---------- account + sizing ---------- */
function acct(){return S.accounts.find(a=>a.id===S.activeAcct)||null}
function equity(){const a=acct();return a?(a.balance>0?a.balance:a.size):5000}
function capFrac(){const a=acct();return a?(a.rules.daily*0.8)/100:0.04}
const riskCap=()=>(+S.risk)/100;
function priceOf(s){const p=S.prices[s.id];return p&&p.v>0?p.v:s.price}
function csOf(s){return S.cs[s.id]>0?S.cs[s.id]:s.cs}
const PIP={XAUUSD:0.1,XAGUSD:0.01,XPTUSD:0.1,BTCUSD:1,ETHUSD:0.1,XLMUSD:0.0001,DOGEUSD:0.0001,ADAUSD:0.0001,XRPUSD:0.0001,LTCUSD:0.01,LNKUSD:0.001,XMRUSD:0.01,OIL:0.01,FX:0.0001};
function pipOf(s){if(PIP[s.id])return PIP[s.id];return s.cls==='fx'?0.0001:s.cls==='indices'?1:s.cls==='metals'?0.1:1}
function pipWord(s){return s.cls==='fx'?'pips':s.cls==='crypto'?'pts ($)':'points'}
function floorLots(l,st){if(!isFinite(l)||l<=0)return 0;return +(Math.floor(l/st+1e-9)*st).toFixed(st<0.1?2:1)}
function lev(cls){const a=acct();return (a?FIRMS[a.firm].lev:FIRMS.Other.lev)[cls]||50}
function sizing(stratId,symId,forceMult){
  const st=STRATS[stratId],s=sym(symId),p=priceOf(s),cs=csOf(s);if(!p||!st)return null;
  const slp=st.slPct,notional=forceMult!=null?forceMult:st.notional;
  const nB=st.basket?Math.max(1,basketCoins().length):1;
  const eff=Math.min(notional*slp,riskCap())/nB,E=equity(),target=E*eff;
  let lots=floorLots(target/(slp*p*cs),s.step),over=false;if(lots<s.step){lots=s.step;over=true}
  const nUsd=lots*cs*p,slUsd=nUsd*slp;
  return {lots,units:lots*cs,nUsd,slPct:slp,slPrice:p*(1-slp),slUsd,riskFrac:slUsd/E,over,p,cs,s,E,margin:nUsd/lev(s.cls),step:s.step,nB};
}
/* holdings: S.pos = [{id,sym,strat,lots,entry,sl}] */
function posRisk(p){const s=sym(p.sym);const cs=s?csOf(s):(p.cs||1);return Math.max(0,p.entry-p.sl)*p.lots*cs}
const curAcc=()=>S.activeAcct||'none';
const acctPos=()=>S.pos.filter(p=>(p.acct||'none')===curAcc());
const acctJ=()=>S.journal.filter(p=>(p.acct||'none')===curAcc());
function openRisk(){let tot=0;for(const p of acctPos())tot+=posRisk(p);return tot}
const holding=(strat,symId)=>acctPos().some(p=>p.strat===strat&&(!symId||p.sym===symId));
const holdSym=symId=>acctPos().some(p=>p.sym===symId);
function verdict(stratId,symId){
  const st=STRATS[stratId];
  if(!inSeason(stratId))return {cls:'stop',title:'Out of season — blocked',lines:['Gold runs Oct–Feb only. Today is '+todayStr()+'; next season in '+daysToGold()+' days.'],z:null};
  if(!firmHas(symId)){const a=acct();return {cls:'stop',title:'Not on '+(a?a.firm:'this firm'),lines:[sym(symId).name+' is not offered here.'],z:null}}
  const E=equity(),tot=openRisk(),cap=E*capFrac(),lines=[];let mult=null,skip=null;
  if(holding(stratId,symId))skip='Already holding this trade. Add nothing.';
  else if(stratId==='fomc'&&holdSym(symId))skip='You already hold this instrument. Add nothing.';
  else if((stratId==='nasTrend'||stratId==='gold')&&holding('fomc',symId))skip='Fed-day trade is open on it. Wait for it to close.';
  else if((stratId==='altMom'||stratId==='ethMom')&&holding('leadlag'))skip='The follow-through basket already holds the coins. Add nothing.';
  else{
    if(stratId==='btcTrend'&&holding('btcMom')){mult=0.15;lines.push('Bitcoin surge is open → half size.')}
    if(stratId==='btcMom'&&holding('btcTrend')){mult=0.15;lines.push('Bitcoin trend is open → half size.')}
    if(stratId==='altMom'){const n=acctPos().filter(p=>p.strat==='altMom').length;if(n>=4)skip='Four coins open — the max.';else if(n>0)lines.push(n+' coin'+(n>1?'s':'')+' open (max 4).')}
  }
  if(skip)return {cls:'stop',title:'Skip',lines:[skip],z:sizing(stratId,symId,mult)};
  const z=sizing(stratId,symId,mult);if(!z)return {cls:'stop',title:'Enter a price',lines:[],z:null};
  const room=cap-tot;
  if(z.over)lines.push('Smallest lot risks '+pcts(z.riskFrac)+' — above your '+S.risk+'%.');
  if(room<=0)return {cls:'stop',title:'Hold off',lines:['Open risk '+money(tot)+' already fills the day cap '+money(cap)+'.'],z};
  if(z.slUsd<=room)return {cls:z.over?'cut':'go',title:(z.over?'Risky · ':'Buy ')+z.lots+' lot',lines:[...lines,'Lose '+money(z.slUsd)+' ('+pcts(z.riskFrac)+') if stopped.'],z};
  const fit=floorLots((room/z.slPct)/(z.cs*z.p),z.step);
  if(fit<z.step)return {cls:'stop',title:'No room today',lines:['Only '+money(room)+' of risk left; the smallest lot needs more.'],z};

function monthStrip(){const cur=istNow().getUTCMonth();let l='',g='',s='';for(let i=0;i<12;i++){l+=`<div class="mo ${i===cur?'now':''}">${MON[i][0]}</div>`;g+=`<div class="b ${(i>=9||i<=1)?'g':''}"></div>`;s+=`<div class="b ${(i>=2&&i<=8)?'s':''}"></div>`}return `<div class="strip12">${l}</div><div class="strip12">${g}</div><div class="strip12">${s}</div><div class="row muted sm" style="gap:14px;margin-top:8px"><span><i style="display:inline-block;width:12px;height:6px;border-radius:3px;background:var(--gold);margin-right:5px"></i>Gold Oct–Feb</span><span><i style="display:inline-block;width:12px;height:6px;border-radius:3px;background:var(--amber);margin-right:5px"></i>Crypto surge Mar–Sep</span><span>Engine runs all year</span></div>`}

/* ---------- TODAY ---------- */
function nextEvents(){const now=istNow(),winter=goldSeason(now),ev=[];const mins=now.getUTCHours()*60+now.getUTCMinutes();
  const add=(h,m,title,sub,open,dayOff)=>{let t=h*60+m-mins,d=0;if(t<0){t+=1440;d=1}ev.push({t,d,title,sub,open})};
  const wd=(d)=>(now.getUTCDay()+d)%7;
  if(winter&&enabled('gold')){const g=usDST(now)?[3,30]:[4,30];const w=goldWin(now);let t=g[0]*60+g[1]-mins,d=0;if(t<0){t+=1440;d=1}if(wd(d)>=2&&wd(d)<=5)ev.push({t,d,title:'Gold window opens',sub:'buy inside '+w+' · sell 12:30 pm',open:'gold:XAUUSD'});
    let t2=12*60+30-mins;if(t2>=0&&wd(0)>=2&&wd(0)<=5&&holding('gold'))ev.push({t:t2,d:0,title:'Sell gold',sub:'12:30 pm market sell',open:'gold:XAUUSD'})}
  add(5,30,'Daily close','check Ethereum'+(enabled('altMom')&&firmHas('XLMUSD')?' + small coins':''),'ethMom:ETHUSD');
  for(const h of [1,5,9,13,17,21]){let t=h*60+30-mins,d=0;if(t<0){t+=1440;d=1}ev.push({t,d,title:'4h close',sub:'Bitcoin'+(firmHas('NAS100')&&enabled('nasTrend')?' & Nasdaq':'')+' trend'+(enabled('btcMom')?' · Bitcoin surge':''),open:'btcTrend:BTCUSD'})}
  const nf=nextFomc();if(nf&&enabled('fomc')&&daysUntil(nf.d)===1){const e=fomcT(nf.d);ev.push({t:9999,d:0,title:'Fed tonight',sub:'buy Nasdaq at '+e.entry,open:'fomc:NAS100'})}
  return ev.sort((a,b)=>a.t-b.t)}
const fmtIn=t=>t<60?t+' min':Math.floor(t/60)+' h '+(t%60?String(t%60).padStart(2,'0')+' m':'');
function dayLine(){const now=istNow(),winter=goldSeason(now),wd=now.getUTCDay(),W=360,L=16,R=344,H=66;const x=h=>L+(R-L)*h/24;
  const hr=now.getUTCHours()+now.getUTCMinutes()/60;const gw=usDST(now)?[3.5,5.5]:[4.5,6.5];
  let g=`<svg class="dayline" viewBox="0 0 ${W} ${H}" role="img" aria-label="today's trading timeline in IST">`;
  g+=`<line x1="${L}" y1="36" x2="${R}" y2="36" stroke="var(--ln)" stroke-width="2"/>`;
  for(let h=0;h<=24;h+=6)g+=`<text x="${x(h)}" y="54" font-size="9.5" font-weight="700" fill="var(--ink3)" text-anchor="${h===0?'start':h===24?'end':'middle'}">${h===0||h===24?'12 am':h===12?'12 pm':h<12?h+' am':(h-12)+' pm'}</text>`;
  if(winter&&wd>=2&&wd<=5){g+=`<rect x="${x(gw[0])}" y="28" width="${x(gw[1])-x(gw[0])}" height="16" rx="5" fill="var(--gold)" opacity=".9"/><text x="${x(gw[0])}" y="20" font-size="10" font-weight="800" fill="var(--gold)">gold buy</text><line x1="${x(12.5)}" y1="28" x2="${x(12.5)}" y2="44" stroke="var(--gold)" stroke-width="3"/><text x="${x(12.5)}" y="20" font-size="10" font-weight="800" fill="var(--gold)" text-anchor="middle">gold sell</text>`}
  for(const h of [1.5,5.5,9.5,13.5,17.5,21.5])g+=`<circle cx="${x(h)}" cy="36" r="3.5" fill="var(--sf)" stroke="var(--ink)" stroke-width="2"/>`;
  g+=`<circle cx="${x(5.5)}" cy="36" r="5" fill="var(--ink)"/><text x="${x(5.5)}" y="${winter&&wd>=2&&wd<=5?'9':'20'}" font-size="10" font-weight="800" fill="var(--ink)" text-anchor="middle">daily close</text>`;
  g+=`<text x="${x(19)}" y="20" font-size="10" font-weight="700" fill="var(--ink2)" text-anchor="middle">○ 4h closes</text>`;
  g+=`<line x1="${x(hr)}" y1="24" x2="${x(hr)}" y2="48" stroke="var(--go)" stroke-width="3" stroke-linecap="round"/><text x="${x(hr)}" y="${H-2}" font-size="10" font-weight="800" fill="var(--go)" text-anchor="middle">now</text>`;
  return g+'</svg>'}

   +sec('Core','highest pass rate — keep on',CORE)
   +sec('Gold · Oct – Feb only',winter?'in season':'opens 1 Oct',WINTER)
   +sec('Optional · all year','switch on for more trades',[...SUMMER,...EXTRA]);

  h+=`<section class="card"><div class="rules">${R.map(r=>`<div class="rule ${r[0]}"><b>${lab[r[0]]}</b><div class="v">${r[1]}${r[2]?'<br>'+r[2]:''}</div>${r[3]?`<small>${r[3]}</small>`:''}</div>`).join('')}</div></section>`;

  mountTV('tvbox',cs_.tv||cs_.id,st.tv,`<div style="width:100%"><div class="muted sm" style="font-weight:700;margin-bottom:8px">Setup preview</div>${schem(stId,symId)}<a class="btn primary wide" style="margin-top:12px" href="${tvLink(cs_.tv||cs_.id,intv)}" target="_blank" rel="noopener">Open live chart &#8599;</a></div>`);

let closeId=null;
function pad2(n){return String(n).padStart(2,'0')}
function jDay(ts){const d=new Date(ts+330*60000);return d.getUTCFullYear()+'-'+pad2(d.getUTCMonth()+1)+'-'+pad2(d.getUTCDate())}
function rJournal(v){
  const a=acct(),base=istNow();let y=base.getUTCFullYear(),m=base.getUTCMonth()+S.cal;
  while(m<0){m+=12;y--}while(m>11){m-=12;y++}
  const monName=MON[m]+' '+y,auto=S.autolog,openA=auto.filter(x=>x.status==='open'),closedA=auto.filter(x=>x.status!=='open'),open=acctPos();
  const byDay={};let mN=0,mW=0,mSum=0;
  closedA.forEach(e=>{const dd=jDay(e.exitT);if(dd.startsWith(y+'-'+pad2(m+1))){(byDay[dd]=byDay[dd]||[]).push(e);mN++;if(e.pct>=0)mW++;mSum+=e.pct}});
  const todayD=jDay(Date.now()),first=new Date(Date.UTC(y,m,1)).getUTCDay(),days=new Date(Date.UTC(y,m+1,0)).getUTCDate();
  let cells='';for(let i=0;i<first;i++)cells+='<div class="c empty"></div>';
  for(let dn=1;dn<=days;dn++){const key=y+'-'+pad2(m+1)+'-'+pad2(dn),es=byDay[key],net=es?es.reduce((t,x)=>t+x.pct,0):null;
    cells+=`<div class="c ${es?'has':''} ${key===S.selDay?'sel':''} ${key===todayD?'today':''}" ${es?`data-day="${key}"`:''}><span class="d">${dn}</span>${net!=null?`<span class="pl ${net>=0?'up':'down'}">${net>=0?'+':''}${net.toFixed(0)}%</span>`:''}</div>`}
  let h=`<section class="card"><div class="head"><h2>Journal</h2><span class="muted sm">auto-tracked from live data</span></div>
    <h3 style="margin-top:14px">My positions${a?' &middot; '+esc(a.label||a.firm):''} (${open.length})</h3>`;
  if(!open.length)h+=`<div class="muted sm">None. Take a trade from Today, then close it here to record your account P/L.</div>`;
  else h+=open.map(pp=>{const s2=sym(pp.sym),liv=S.prices[pp.sym]&&S.prices[pp.sym].v>0,pr=priceOf(s2),up=liv?(pr-pp.entry)*pp.lots*csOf(s2):null;
    if(closeId===pp.id)return `<div class="pos" style="grid-template-columns:1fr auto"><div><b>${firmTicker(pp.sym)}</b> ${pp.lots} lot<small>in ${fmt(pp.entry,pd(pp.entry))}</small></div><div class="inl" style="max-width:230px"><input id="cx" type="number" step="any" placeholder="exit price" value="${liv?fmt(pr,pd(pr)):''}"><button class="btn primary s" id="cxok" type="button">Log</button><button class="btn s" id="cxno" type="button">&times;</button></div></div>`;
    return `<div class="pos"><div><b>${esc((STRATS[pp.strat]||{}).name||'Manual')}</b> &middot; ${firmTicker(pp.sym)}<small>${pp.lots} lot &middot; in ${fmt(pp.entry,pd(pp.entry))} &middot; stop ${fmt(pp.sl,pd(pp.sl))}</small></div><div class="r">${up!=null?`<span class="${up>=0?'pl up':'pl down'}">${up>=0?'+':''}${money(up)}</span>`:money(posRisk(pp))}<small>${up!=null?'live':'risk'}</small></div><button class="btn s" data-cl="${pp.id}" type="button">Close</button></div>`}).join('');
  {const cj=acctJ();if(cj.length){const net=cj.reduce((t,x)=>t+(x.pnl||0),0),w=cj.filter(x=>(x.pnl||0)>0).length;h+=`<div class="muted sm" style="margin-top:8px">Closed on this account: <b>${cj.length}</b> &middot; ${Math.round(w/cj.length*100)}% win &middot; net <b class="${net>=0?'pl up':'pl down'}">${net>=0?'+':''}${money(net)}</b></div>`}}
  h+=`<h3 style="margin-top:20px">Signals the tool generated</h3>`;
  if(!auto.length)h+=`<div class="muted sm">Nothing yet. As each buy and exit fires on live data, the tool logs it here on its own &mdash; win or loss, with the reason. (Runs on the hosted site or from the alert bot.)</div>`;
  else{if(openA.length)h+=`<div class="muted sm" style="margin:4px 0 6px">Tracking now (${openA.length})</div>`+openA.map(e=>{const s2=sym(e.sym),liv=S.prices[e.sym]&&S.prices[e.sym].v>0,px=priceOf(s2),up=liv?(px/e.entry-1)*100:null;return `<div class="pos"><div><b>${STRATS[e.strat].name}</b> &middot; ${firmTicker(e.sym)}<small>in ${fmt(e.entry,pd(e.entry))} &middot; stop ${fmt(e.stop,pd(e.stop))}</small></div><div class="r">${up!=null?`<span class="${up>=0?'pl up':'pl down'}">${up>=0?'+':''}${up.toFixed(1)}%</span>`:'open'}<small>live</small></div></div>`}).join('');}
  h+=`<div class="head" style="margin-top:20px"><h3 style="margin:0">${monName}</h3><div class="row" style="gap:6px"><button class="btn s" id="pm" type="button">&lsaquo;</button><button class="btn s" id="tm" type="button">This month</button><button class="btn s" id="nm" type="button">&rsaquo;</button></div></div>
    <div class="jsum"><div><b>Signals</b><span>${mN}</span></div><div><b>Win rate</b><span>${mN?Math.round(mW/mN*100)+'%':'—'}</span></div><div><b>Net move</b><span class="${mSum>=0?'pl up':'pl down'}">${mN?(mSum>=0?'+':'')+mSum.toFixed(1)+'%':'—'}</span></div></div>
    <div class="cal">`+['S','M','T','W','T','F','S'].map(d=>`<div class="dow">${d}</div>`).join('')+cells+`</div>`;
  if(S.selDay&&byDay[S.selDay])h+=`<h3 style="margin-top:16px">${S.selDay}</h3>`+byDay[S.selDay].map(e=>`<div class="pos"><div><b>${STRATS[e.strat].name}</b> &middot; ${firmTicker(e.sym)}<small>${fmt(e.entry,pd(e.entry))} &rarr; ${fmt(e.exit,pd(e.exit))} &middot; ${e.why}</small></div><div class="r"><span class="${e.pct>=0?'pl up':'pl down'}">${e.pct>=0?'+':''}${e.pct.toFixed(1)}%</span></div></div>`).join('');
  h+=`</section>`;
  v.innerHTML=h;
  if($('pm'))$('pm').onclick=()=>{S.cal--;S.selDay=null;save();render()};
  if($('nm'))$('nm').onclick=()=>{S.cal++;S.selDay=null;save();render()};
  if($('tm'))$('tm').onclick=()=>{S.cal=0;S.selDay=null;save();render()};
  v.querySelectorAll('[data-day]').forEach(c=>c.onclick=()=>{S.selDay=S.selDay===c.dataset.day?null:c.dataset.day;save();render()});
  v.querySelectorAll('[data-cl]').forEach(b=>b.onclick=()=>{closeId=b.dataset.cl;render()});
  if($('cxok'))$('cxok').onclick=()=>{const pp=S.pos.find(x=>x.id===closeId);if(!pp)return;const exit=+$('cx').value;if(!(exit>0))return;const s2=sym(pp.sym),pnl=(exit-pp.entry)*pp.lots*csOf(s2);S.journal.push({...pp,exit,pnl,closed:Date.now()});S.pos=S.pos.filter(x=>x.id!==closeId);closeId=null;save();render()};
  if($('cxno'))$('cxno').onclick=()=>{closeId=null;render()};
}

/* ---------- CALCULATOR (reference: FundedNext / standard forex lot-size calc) ---------- */
let C={symId:'XAUUSD',entry:0,stopVia:'strat',stopPips:null,stopPrice:null,stopPct:null,pipVal:null,lots:null,lotsSet:false,riskPct:null,size:0};
function rCalc(v){
  const s=sym(C.symId),a=acct();
  const E=C.size>0?C.size:(S.calcSize>0?S.calcSize:(a?equity():5000));
  const cs=csOf(s),step=s.step,pip=pipOf(s),p=C.entry>0?C.entry:priceOf(s),dec=pd(p);
  const pipVal=C.pipVal>0?C.pipVal:+(pip*cs).toFixed(4);           // $ per pip per 1.00 lot
  const strat=s.strats.length?STRATS[s.strats[0]]:null;
  let stopPips;
  if(C.stopVia==='pips'&&C.stopPips>0)stopPips=C.stopPips;
  else if(C.stopVia==='price'&&C.stopPrice>0)stopPips=Math.abs(p-C.stopPrice)/pip;
  else if(C.stopVia==='pct'&&C.stopPct>0)stopPips=(p*C.stopPct/100)/pip;
  else stopPips=(p*(strat?strat.slPct:0.01))/pip;
  if(!(stopPips>0))stopPips=1;
  const slPrice=p-stopPips*pip, slPct=stopPips*pip/p;
  const riskPct=C.riskPct!=null?C.riskPct:+S.risk, riskAmt=E*riskPct/100;
  let lots,minLot=false,solved;
  if(C.lotsSet&&C.lots>0){lots=C.lots;solved='risk'}
  else{lots=floorLots(riskAmt/(stopPips*pipVal),step);if(lots<step){lots=step;minLot=true}solved='lots'}
  const riskUsd=lots*stopPips*pipVal, riskFrac=riskUsd/E, notional=lots*cs*p, margin=notional/lev(s.cls);
  const tot=openRisk(),cap=E*capFrac(),room=cap-tot;
  const sizeOpts=[...new Set([...SIZES,...(a?[equity()]:[]),E])].sort((x,y)=>x-y);
  const word=pipWord(s);
  v.innerHTML=`<section class="card"><h2>Lot size calculator</h2>
    <div class="grid" style="margin-top:12px">
      <label>Instrument<select id="c_sym">${SYMS.map(x=>`<option value="${x.id}" ${x.id===C.symId?'selected':''}>${firmTicker(x.id)} &middot; ${x.name}</option>`).join('')}</select></label>
      <label>Account size<select id="c_size">${sizeOpts.map(x=>`<option value="${x}" ${x===E?'selected':''}>${money(x)}${a&&x===equity()?' &middot; '+esc(a.label||a.firm):''}</option>`).join('')}</select></label>
      <label>Risk per trade<div class="inl"><input id="c_risk" type="number" step="0.1" value="${+riskPct.toFixed(2)}"><span class="muted sm">% = ${money(riskAmt)}</span></div></label>
      <label>Entry price<div class="inl"><input id="c_px" type="number" step="any" value="${(+p).toFixed(dec)}">${canLive(s)?`<button class="btn s" id="c_live" type="button">Live</button>`:''}</div></label>
    </div>
    <div class="subh">Stop-loss &mdash; set it any one way, the others follow</div>
    <div class="grid">
      <label>${word}<input id="c_pips" type="number" step="any" value="${+stopPips.toFixed(1)}"></label>
      <label>Stop price<input id="c_slp" type="number" step="any" value="${(+slPrice).toFixed(dec)}"></label>
      <label>Stop %<input id="c_slpct" type="number" step="0.1" value="${+(slPct*100).toFixed(2)}"></label>
    </div>
    <div class="grid" style="margin-top:12px">
      <label>Your lots <span class="muted" style="font-weight:500;text-transform:none">(optional)</span><input id="c_lots" type="number" step="${step}" value="${C.lotsSet&&C.lots>0?C.lots:''}" placeholder="blank = work it out"></label>
    </div>
    <details style="margin-top:4px"><summary>Contract spec</summary><div class="grid body"><label>${word} value / lot<input id="c_pipv" type="number" step="any" value="${pipVal}"></label><label>Contract size<input id="c_cs" type="number" step="any" value="${cs}"></label></div><p class="muted sm" style="margin-top:8px">Defaults match a standard MT5 account. If your broker&rsquo;s spec differs, change the value/lot here &mdash; same as FundedNext&rsquo;s calculator.</p></details>
    </section>
    <section class="card"><div class="head"><h3 style="margin:0">${solved==='risk'?'With '+fmt(lots,step<0.1?2:1)+' lots':'To risk '+pcts(riskFrac,2)}</h3><span class="tag ${solved==='risk'?'amber':'green'}">${solved==='risk'?'risk from lots':'lots from risk'}</span></div>
    <div class="nums" style="margin-top:10px">
      <div class="cell ${solved==='lots'?'hi':''}"><b>Lot size</b><div class="v">${fmt(lots,step<0.1?2:1)}</div><small>${fmt(lots*cs,p>100?4:0)} ${s.unit||'units'}${minLot?' &middot; min lot':''}</small></div>
      <div class="cell ${solved==='risk'?'hi':''} ${riskUsd>room?'bad':riskFrac>riskCap()+1e-9?'over':'ok'}"><b>Risk if stopped</b><div class="v">${money(riskUsd)}</div><small>${pcts(riskFrac,2)} of ${money(E)}</small></div>
      <div class="cell"><b>Stop price</b><div class="v">${fmt(slPrice,dec)}</div><small>${fmt(stopPips,1)} ${word} &middot; ${pcts(slPct,2)}</small></div>
      <div class="cell"><b>Position value</b><div class="v">${money(notional)}</div><small>margin ${money(margin)} &middot; 1:${lev(s.cls)}</small></div>
      <div class="cell"><b>${word} value</b><div class="v">${money(lots*pipVal)}</div><small>per ${word.replace(' ($)','')} on this trade</small></div>
      <div class="cell"><b>Targets</b><div class="v">${fmt(p*(1+slPct),dec)}</div><small>1R &middot; 2R ${fmt(p*(1+2*slPct),dec)} &middot; 3R ${fmt(p*(1+3*slPct),dec)}</small></div>
    </div>
    <div class="lines" style="margin-top:12px">
      ${riskUsd>room?`<div class="line no"><span class="m">&times;</span><div>Over today&rsquo;s cap &mdash; only ${money(Math.max(0,room))} of risk left.</div></div>`:`<div class="line"><span class="m">&check;</span><div>Fits today&rsquo;s cap &middot; ${money(room-riskUsd)} left after this.</div></div>`}
      ${riskFrac>riskCap()+1e-9?`<div class="line no"><span class="m">&times;</span><div>Above your ${S.risk}% setting &mdash; max is <b>${fmt(floorLots(riskCap()*E/(stopPips*pipVal),step),step<0.1?2:1)} lots</b>.</div></div>`:''}
      ${minLot?`<div class="line no"><span class="m">&times;</span><div>Even the smallest lot (${step}) risks ${pcts(riskFrac,2)}.</div></div>`:''}
    </div></section>`;
  const b=(id,fn)=>{if($(id))$(id).onchange=()=>{fn($(id).value);render()}};
  b('c_sym',x=>{C={symId:x,entry:0,stopVia:'strat',stopPips:null,stopPrice:null,stopPct:null,pipVal:null,lots:null,lotsSet:false,riskPct:C.riskPct,size:C.size}});
  b('c_size',x=>{C.size=+x||0;S.calcSize=C.size;save()});
  b('c_risk',x=>{C.riskPct=x===''?null:+x});
  b('c_px',x=>{C.entry=+x||0});
  b('c_pips',x=>{C.stopVia='pips';C.stopPips=+x||0});
  b('c_slp',x=>{C.stopVia='price';C.stopPrice=+x||0});
  b('c_slpct',x=>{C.stopVia='pct';C.stopPct=+x||0});
  b('c_lots',x=>{C.lots=+x||0;C.lotsSet=!!(+x>0)});
  b('c_pipv',x=>{C.pipVal=+x||0});
  b('c_cs',x=>{S.cs[s.id]=+x||0;save()});
  if($('c_live'))$('c_live').onclick=()=>{C.entry=0;refresh([s.id],$('c_live'))};
}

/* ---------- ACCOUNT ---------- */
let draft=null;
function newDraft(){const r=FIRMS.FundedNext.programs['Stellar 2-Step'];return {id:uid(),label:'',firm:'FundedNext',program:'Stellar 2-Step',size:5000,custom:0,phaseIdx:0,balance:0,rules:{daily:r.daily,max:r.max}}}
function finalize(d){const prog=FIRMS[d.firm].programs[d.program]||FIRMS.Other.programs.Custom,ph=prog.ph[Math.min(d.phaseIdx,prog.ph.length-1)];return {...d,size:d.custom>0?d.custom:d.size,phase:{name:ph[0],target:ph[1]},phaseName:ph[0],rules:{daily:+d.rules.daily,max:+d.rules.max}}}
function rAcct(v){
  let h=`<section class="card"><div class="head"><h2>Account</h2><button class="btn s primary" id="add" type="button">${draft?'Cancel':'+ Add'}</button></div></section>`;
  if(draft){const d=draft,progs=Object.keys(FIRMS[d.firm].programs),prog=FIRMS[d.firm].programs[d.program]||FIRMS[d.firm].programs[progs[0]];
    h+=`<section class="card"><div class="grid">
      <label>Nickname<input id="f_label" value="${esc(d.label)}" placeholder="FN 5k"></label>
      <label>Firm<select id="f_firm">${Object.keys(FIRMS).map(f=>`<option ${f===d.firm?'selected':''}>${f}</option>`).join('')}</select></label>
      <label>Program<select id="f_prog">${progs.map(p=>`<option ${p===d.program?'selected':''}>${p}</option>`).join('')}</select></label>
      <label>Size<select id="f_size">${SIZES.map(x=>`<option value="${x}" ${x===d.size&&!d.custom?'selected':''}>${money(x)}</option>`).join('')}<option value="0" ${d.custom>0?'selected':''}>Custom…</option></select></label>
      ${d.custom>0?`<label>Custom $<input id="f_custom" type="number" value="${d.custom}"></label>`:''}
      <label>Phase<select id="f_phase">${prog.ph.map((p,i)=>`<option value="${i}" ${i===d.phaseIdx?'selected':''}>${p[0]}${p[1]?' · +'+p[1]+'%':''}</option>`).join('')}</select></label>
      <label>Balance now $<input id="f_bal" type="number" value="${d.balance||''}" placeholder="blank = size"></label>
      <label>Daily loss %<input id="f_daily" type="number" step="0.5" value="${d.rules.daily}"></label>
      <label>Max loss %<input id="f_max" type="number" step="0.5" value="${d.rules.max}"></label>
    </div><div class="row" style="margin-top:12px"><button class="btn primary" id="sv" type="button">Save</button><span class="muted sm">Day cap used by the app = 80 % of daily loss.</span></div></section>`}
  if(!S.accounts.length&&!draft)h+=`<section class="card"><div class="empty">No account yet.</div></section>`;
  h+=`<section class="card"><h3>Live data</h3><p class="muted sm">Crypto is live from Binance, free, no key. For live <b>gold</b> and <b>Nasdaq</b> prices + signals, paste a free Twelve Data key (twelvedata.com → sign up → API key; 800 calls/day).</p><div class="row" style="margin-top:8px"><input id="tdk" placeholder="Twelve Data API key" value="${esc(S.tdKey)}" style="flex:1;min-width:200px"><button class="btn s" id="tds" type="button">Save</button></div></section>`;
  for(const a of S.accounts){const E=a.balance>0?a.balance:a.size,on=a.id===S.activeAcct;
    const apos=S.pos.filter(x=>(x.acct||'none')===a.id),aj=S.journal.filter(x=>(x.acct||'none')===a.id);
    const net=aj.reduce((t,x)=>t+(x.pnl||0),0),wins=aj.filter(x=>(x.pnl||0)>0).length;
    h+=`<section class="card" style="${on?'box-shadow:inset 0 0 0 2px var(--gold)':''}"><div class="head"><div><h2 style="font-size:19px">${esc(a.label||a.firm)}</h2><p class="muted">${a.firm} &middot; ${a.program} &middot; ${a.phaseName}</p></div><div class="row">${on?'<span class="tag gold">active</span>':`<button class="btn s" type="button" data-use="${a.id}">Use</button>`}<button class="btn s" type="button" data-ed="${a.id}">Edit</button><button class="btn s danger" type="button" data-del="${a.id}">&times;</button></div></div>
      <div class="stats" style="margin-top:10px"><div class="stat"><div class="v">${money(E)}</div><small>size</small></div><div class="stat"><div class="v">${a.phase.target?money(E*a.phase.target/100):'—'}</div><small>${a.phase.target?'target +'+a.phase.target+'%':'funded'}</small></div><div class="stat"><div class="v">${money(E*a.rules.daily/100)}</div><small>daily loss ${a.rules.daily}%</small></div><div class="stat"><div class="v">${money(E*a.rules.max/100)}</div><small>max loss ${a.rules.max}%</small></div></div>
      <div class="arow"><div><b>${apos.length}</b> open<small>${money(apos.reduce((t,x)=>t+posRisk(x),0))} at risk</small></div><div><b>${aj.length}</b> closed<small>${aj.length?Math.round(wins/aj.length*100)+'% win':'none yet'}</small></div><div><b class="${net>=0?'pl up':'pl down'}">${aj.length?(net>=0?'+':'')+money(net):'—'}</b><small>net P/L</small></div></div>
      ${apos.length?`<div class="muted sm" style="margin-top:8px">Open: ${apos.map(x=>firmTicker(x.sym)+' '+x.lots).join(', ')}</div>`:''}</section>`}
  v.innerHTML=h;
  $('add').onclick=()=>{draft=draft?null:newDraft();render()};
  $('tds').onclick=()=>{S.tdKey=$('tdk').value.trim();S.sig={};save();render();checkSignals(true)};
  if(draft){const b=(id,fn)=>{if($(id))$(id).onchange=()=>{fn($(id).value);render()}};
    b('f_label',x=>draft.label=x);b('f_firm',x=>{draft.firm=x;const p=Object.keys(FIRMS[x].programs)[0];draft.program=p;const r=FIRMS[x].programs[p];draft.rules={daily:r.daily,max:r.max};draft.phaseIdx=0});
    b('f_prog',x=>{draft.program=x;const r=FIRMS[draft.firm].programs[x];draft.rules={daily:r.daily,max:r.max};draft.phaseIdx=0});
    b('f_size',x=>{if(+x>0){draft.size=+x;draft.custom=0}else draft.custom=draft.custom||5000});b('f_custom',x=>draft.custom=+x||0);b('f_phase',x=>draft.phaseIdx=+x);b('f_bal',x=>draft.balance=+x||0);b('f_daily',x=>draft.rules.daily=+x);b('f_max',x=>draft.rules.max=+x);
    $('sv').onclick=()=>{const a=finalize(draft),i=S.accounts.findIndex(x=>x.id===a.id);if(i>=0)S.accounts[i]=a;else S.accounts.push(a);S.activeAcct=a.id;draft=null;save();render()}}
  v.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{S.activeAcct=b.dataset.use;save();render()});
  v.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{const a=S.accounts.find(x=>x.id===b.dataset.ed),prog=FIRMS[a.firm]&&FIRMS[a.firm].programs[a.program];draft={...a,custom:SIZES.includes(a.size)?0:a.size,phaseIdx:prog?Math.max(0,prog.ph.findIndex(p=>p[0]===a.phaseName)):0,rules:{...a.rules}};render()});
  v.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(b.dataset.c){S.accounts=S.accounts.filter(x=>x.id!==b.dataset.del);if(S.activeAcct===b.dataset.del)S.activeAcct=S.accounts[0]?S.accounts[0].id:null;save();render()}else{b.dataset.c='1';b.textContent='Sure?'}});
}

$('acctPill').onclick=()=>go('acct');
document.querySelectorAll('.seg [data-risk]').forEach(b=>b.onclick=()=>{S.risk=b.dataset.risk;save();render()});
function applyTheme(){let t=S.theme;if(t==='system')t=(window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light';document.documentElement.dataset.theme=t;$('themeBtn').textContent=t==='dark'?'☀ Light':'☾ Dark'}
$('themeBtn').onclick=()=>{const cur=document.documentElement.dataset.theme;S.theme=cur==='dark'?'light':'dark';save();applyTheme();render()};
applyTheme();
if(!NAV.some(n=>n[0]===S.route))S.route='today';
if(S.route==='strat'&&S.detail&&!STRATS[S.detail.split(':')[0]])S.detail=null;
render();
// auto-refresh live prices for the plan symbols once on load (Binance is free & unlimited)
const PLANSYMS=['BTCUSD','ETHUSD','XAUUSD','NAS100','XLMUSD','DOGEUSD','ADAUSD','XRPUSD'];
const tick=()=>refresh(PLANSYMS).then(()=>checkSignals(true));
setTimeout(tick,300);
setInterval(tick,10*60*1000);                       // every 10 minutes while the page is open
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});  // and whenever you come back to it
})();
</script>
</body>
</html>
